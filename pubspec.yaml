name: all_stars_arena
description: "SMASH UP INDIA - Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.0
  dio_cache_interceptor: ^3.5.0
  cached_network_image: ^3.4.1
  razorpay_flutter: ^1.3.7
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  device_info_plus: ^11.2.1
  connectivity_plus: ^6.1.1
  form_validator: ^2.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.16
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  logger: ^2.5.0
  flutter_dotenv: ^5.2.1
  internet_connection_checker_plus: ^2.5.2
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: any
  json_serializable: any
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/App_Logo/smash_up_india.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - assets/images/App_Logo/
    - assets/images/Refer/
    - assets/images/No_data/
    - assets/images/Home_page/
    - assets/images/find_Games/
    - assets/images/Login/
